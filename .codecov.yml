codecov:
  require_ci_to_pass: false

ignore:
  - "pkg/git"
  - ".agents/**"
  - ".claude/**"
  - ".cursor/**"
  - "skills/**"
  - "docs/**"
  - "*.md"
  - "*.toml"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment: false
