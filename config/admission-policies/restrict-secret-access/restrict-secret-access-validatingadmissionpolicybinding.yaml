---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-secret-access.build-service.konflux-ci.dev
spec:
  policyName: "restrict-secret-access.build-service.konflux-ci.dev"
  validationActions: [Deny]
  # No matchResources selector on purpose: the binding must cover secrets in every namespace
  # so the policy can catch (and deny) access to namespaces that are neither "*-tenant" nor "build-service".
