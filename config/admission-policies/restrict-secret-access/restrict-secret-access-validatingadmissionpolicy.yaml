---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-secret-access.build-service.konflux-ci.dev
spec:
  # If the policy cannot be evaluated, deny the request rather than silently granting the build-service operator access to a secret.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
        scope: "Namespaced"
  # Only evaluate requests coming from the build-service operator's service account.
  # Every other identity is left untouched by this policy.
  matchConditions:
    - name: 'only-build-service-operator'
      expression: "request.userInfo.username == 'system:serviceaccount:build-service:build-service-controller-manager'"
  validations:
    # The build-service operator may only touch secrets in tenant namespaces (named "*-tenant") and in its own "build-service" namespace.
    - expression: "request.namespace == 'build-service-system' || request.namespace.endsWith('-tenant')"
      messageExpression: |-
        "build-service operator is not allowed to access secrets in namespace '" + request.namespace + "'; access is restricted to '*-tenant' namespaces and the 'build-service' namespace"
      message: "build-service operator is not allowed to access secrets outside of '*-tenant' namespaces and the 'build-service' namespace"
